project_id = "styli"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# Authenticates with CATALOG_SYNC_SECRET (x-sync-secret) so pg_cron can call it.
[functions.sync-catalog]
verify_jwt = false

[functions.enrich-catalog]
verify_jwt = false

[functions.enrich-product]
verify_jwt = false

# Authenticates with CATALOG_SYNC_SECRET or the service role. Channel3 key stays server-side.
[functions.sync-channel3]
verify_jwt = false

# Anon key is accepted as Bearer so signed-out users can add a brand.
[functions.resolve-brand]
verify_jwt = true
